<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Result</title>
    <link rel="stylesheet" href="./quiz.css">
</head>
<body>
    <div class="quiz-container final-container">
        <div class="quiz-wrapper final-wrapper">
            <div class="final">
                <h1>Thank you for taking the quiz!</h1>
                <p class="pt-translation">Obrigado por participar do quiz!</p>
                <p>You got <span id="acertos">0</span> right and <span id="erros">0</span> wrong.</p>
                <p class="pt-translation">Você acertou <span id="acertosPt">0</span> e errou <span id="errosPt">0</span>.</p>
                <p>Total time: <span id="tempo">00:00</span></p>
                <p class="pt-translation">Tempo total: <span id="tempoPt">00:00</span></p>
                <p>Play again? <a href="index.html">Click here</a></p>
                <p class="pt-translation">Jogar novamente? <a href="index.html">Clique aqui</a></p>
            </div>
        </div>
    </div>
    <script>
        const acertosElement = document.getElementById('acertos');
        const errosElement = document.getElementById('erros');
        const tempoElement = document.getElementById('tempo');
        const acertosPtElement = document.getElementById('acertosPt');
        const errosPtElement = document.getElementById('errosPt');
        const tempoPtElement = document.getElementById('tempoPt');

        const acertos = sessionStorage.getItem('quiz_acertos') || 0;
        const erros = sessionStorage.getItem('quiz_erros') || 0;
        const tempo = sessionStorage.getItem('quiz_tempo') || 0;

        function formatSecondsToMMSS(totalSeconds) {
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        acertosElement.innerText = acertos;
        errosElement.innerText = erros;
        tempoElement.innerText = formatSecondsToMMSS(Number(tempo));
        acertosPtElement.innerText = acertos;
        errosPtElement.innerText = erros;
        tempoPtElement.innerText = formatSecondsToMMSS(Number(tempo));
    </script>
</body>
</html>
