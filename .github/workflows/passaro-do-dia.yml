name: Pássaro do Dia

on:
  schedule:
    # 03:00 UTC = 00:00 no horário de Brasília (UTC-3, sem horário de verão)
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  escolher:
    runs-on: ubuntu-latest
    steps:
      - name: Baixa o repositório
        uses: actions/checkout@v4

      - name: Configura o Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Escolhe o pássaro do dia e avisa por e-mail/WhatsApp
        run: node scripts/escolher-passaro-do-dia.js
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BOSS_EMAIL: ${{ secrets.BOSS_EMAIL }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          # Lista pública de inscritos (ver workers/inscrever-passaro-do-dia.js).
          # Sem estes dois, o broadcast é pulado e só o aviso pessoal sai.
          RESEND_SEGMENT_ID: ${{ secrets.RESEND_SEGMENT_ID }}
          RESEND_REMETENTE: ${{ secrets.RESEND_REMETENTE }}

      - name: Commita e envia a mudança
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/passaro-do-dia.json
          git diff --staged --quiet || git commit -m "Atualiza o pássaro do dia"
          git push
