name: Pássaro do Dia

on:
  schedule:
    # 03:00 UTC = 00:00 no horário de Brasília (UTC-3, sem horário de verão)
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  escolher:
    runs-on: ubuntu-latest
    steps:
      - name: Baixa o repositório
        uses: actions/checkout@v4

      - name: Escolhe o pássaro do dia
        run: node scripts/escolher-passaro-do-dia.js

      - name: Commita e envia a mudança
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/passaro-do-dia.json
          git diff --staged --quiet || git commit -m "Atualiza o pássaro do dia"
          git push
